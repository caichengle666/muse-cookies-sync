# Cookie Sync —— Nginx 反向代理 + HTTPS
# ---------------------------------------------------------------
# 安装步骤（以 Debian/Ubuntu 为例）：
#
#  1) 装 Nginx 与 certbot
#     sudo apt update && sudo apt install -y nginx certbot python3-certbot-nginx
#
#  2) 先只放 80 端口的 server 块（把下面第一个 server 块复制过去），
#     改好 server_name，然后：
#     sudo cp nginx-cookie-sync.conf /etc/nginx/conf.d/cookie-sync.conf
#     sudo nginx -t && sudo systemctl reload nginx
#
#  3) 申请证书（certbot 会自动改写 443 配置）
#     sudo certbot --nginx -d sync.example.com
#
#  4) 若 certbot 没自动生成 443 块，就手动补上下面的 443 server 块，
#     再 sudo nginx -t && sudo systemctl reload nginx
#
# 说明：域名请指向你的 VPS，并确保云厂商安全组放行 80 / 443。
# ---------------------------------------------------------------

# ---------- HTTP：仅用于 ACME 验证 + 跳转 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name sync.example.com;          # ← 改成你的域名

    # certbot 验证用
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS：真正的接口 ----------
server {
    # 经典写法（nginx < 1.25 用它）：
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # 若你的 nginx ≥ 1.25.1，请改成下面两行（否则会报 "http2" 参数已废弃）：
    # listen 443 ssl;
    # listen [::]:443 ssl;
    # http2 on;

    server_name sync.example.com;          # ← 改成你的域名

    ssl_certificate     /etc/letsencrypt/live/sync.example.com/fullchain.pem;   # ← 改域名
    ssl_certificate_key /etc/letsencrypt/live/sync.example.com/privkey.pem;     # ← 改域名
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # 请求体上限：服务端内部限制 5MB，这里给到略大
    client_max_body_size 6m;

    # 隐藏 nginx 版本号
    server_tokens off;

    # --- 可选（推荐）：只允许你自己的固定出口 IP 访问 ---
    # allow 203.0.113.10;
    # deny  all;

    # 只把管理页和 API 反代给 Node 服务，其余一律 404
    location = /admin {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;    # ← 与 .env 里的 PORT 一致

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # X-Auth-Token 默认就会被透传，这里显式声明便于排查
        proxy_pass_request_headers on;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    location / {
        return 404;
    }
}
